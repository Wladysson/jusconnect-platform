services:

  postgres:
    image: postgres:17
    container_name: postgres-jusconnect
    environment:
      POSTGRES_DB: jusconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  jusconnect:
    image: jusconnect-platform:1.0.1
    container_name: jusconnect
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/jusconnect
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres